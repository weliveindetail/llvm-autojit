name: Ubuntu 22.04

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-llvm21:
    name: check-llvm21 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      # Only arch matters, not OS versions (tests run inside the containers)
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout llvm-autojit
      uses: actions/checkout@v4
    - name: Pull docker image
      run: docker pull weliveindetail/ubuntu-llvm21:22.04
    - name: Run regression tests against Ubuntu LLVM 21
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace/llvm-autojit \
          -w /workspace \
          weliveindetail/ubuntu-llvm21:22.04 \
          /workspace/llvm-autojit/benchmark/linux/docker-tests.sh
    - name: Build sample projects with shared library
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace/llvm-autojit \
          -w /workspace \
          weliveindetail/ubuntu-llvm21:22.04 \
          /workspace/llvm-autojit/benchmark/linux/docker-samples-shlib.sh
    - name: Build sample projects with static stub and autojitd
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace/llvm-autojit \
          -w /workspace \
          weliveindetail/ubuntu-llvm21:22.04 \
          /workspace/llvm-autojit/benchmark/linux/docker-samples-autojitd.sh
